# GPU fleet inventory.
#
# gpu-node-01 is the local RTX 3070 (dev/bench node). The same playbook runs
# unchanged against rented cloud GPU nodes by swapping the host/connection,
# which is the point: validate locally, deploy identically in production.

[gpu_nodes]
gpu-node-01 ansible_host=localhost ansible_connection=local

[gpu_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
# Path to the gpu-validation repo on each node
gpu_validation_dir=/home/bean/lab/gpu-validation
# Control-plane gate endpoint (LocalStack dev; swap for real API Gateway URL)
gate_endpoint=http://localhost:4566/restapis/c2mfyqig2o/prod/_user_request_/validate
